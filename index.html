<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0B1F" />
    <meta name="description" content="Fluent — leer 6 talen met lessen, toetsen, doelen en landen veroveren. Zonder straf, mét plezier." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fluent" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Fluent — Taal leren die plakt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;800&family=Cormorant+Garamond:wght@600;700&family=Space+Grotesk:wght@600;700&family=Fredoka:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* De opening, geschreven in de pagina zelf zodat hij er is bij het
         eerste beeld. Bewust geen tekening die zichzelf schrijft: die hangt af
         van padlengtes en van hoeveel rekentijd een telefoon overheeft, en dan
         zie je bij een trage start alleen wat losse stippen. Dit is een naam,
         een lijn die vult, en een regel eronder. Dat klopt altijd. */
      #opening {
        position: fixed;
        inset: 0;
        z-index: 9;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(180deg, #14103a 0%, #0e0b1f 55%, #080614 100%);
        transition: opacity 420ms ease, visibility 420ms;
      }
      /* Zodra de app staat neemt die het over. Bewust in de stijl zelf en niet
         in javascript: de app hoeft dan niets terug te melden, en er kan dus
         ook niets misgaan in die terugmelding. Precies dat gebeurde bij de
         eerste poging: de klasse werd nooit gezet en de opening bleef eeuwig
         staan, terwijl de app er allang was. De regel met .app-staat blijft
         als vangnet voor een browser die :has nog niet kent. */
      body:has(#root > *) #opening,
      body.app-staat #opening {
        opacity: 0;
        visibility: hidden;
      }
      .opening-naam {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: 0.02em;
        background: linear-gradient(120deg, #a855f7 0%, #ec4899 52%, #ffc53d 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: opening-op 620ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .opening-onder {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        /* licht genoeg om te lezen op de donkerste plek van het verloop */
        color: #8d87b4;
        animation: opening-op 620ms cubic-bezier(0.2, 0.8, 0.2, 1) 220ms both;
      }
      /* de lijn die vult: geen tandwiel en geen cirkeltje, maar iets dat bij
         het merk hoort en dat vooruitgang suggereert zonder te liegen over
         hoever hij is */
      .opening-spoor {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .opening-spoor span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #a855f7, #ec4899, #ffc53d);
        animation: opening-spoor 1400ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes opening-op {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes opening-spoor {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(365%); }
      }
      /* wie beweging heeft uitgezet krijgt de naam meteen en een rustige lijn */
      @media (prefers-reduced-motion: reduce) {
        .opening-naam,
        .opening-onder { animation: none; opacity: 1; transform: none; }
        .opening-spoor span { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <!--
      DE OPENING.

      De app is ruim een megabyte, en op een telefoon met matig bereik duurt
      het seconden voordat daar iets van te zien is. Een bezoeker keek in die
      tijd naar een leeg vlak, en dat is precies de eerste indruk die je nooit
      meer terugkrijgt.

      Dit staat in de pagina zelf, niet in de app: het verschijnt bij het
      eerste beeld, zonder dat er ook maar één regel javascript geladen hoeft
      te zijn. De naam wordt geschreven alsof iemand hem tekent, en zodra de
      app er is neemt die het over en dooft dit weg.

      Alles staat hier bewust in de pagina en niet in een stijlbestand: een
      apart bestand is een extra verzoek, en dan ben je precies die seconde
      kwijt die je wilde vullen.
    -->
    <div id="opening" aria-hidden="true">
      <p class="opening-naam">Fluent</p>
      <div class="opening-spoor"><span></span></div>
      <p class="opening-onder">taal leren die plakt</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
